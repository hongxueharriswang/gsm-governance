[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsm-governance"
version = "0.1.0"
description = "Multi-level governance modelling with a bounded non-exploitation constraint"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Harris Wang", email = "harrisw@athabascau.ca"}]
keywords = ["governance", "cybernetics", "multi-level governance", "human flourishing", "non-exploitation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.22", "pandas>=1.5", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "black>=23", "ruff>=0.1", "mypy>=1"]

[tool.setuptools.packages.find]
include = ["gsm_governance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
